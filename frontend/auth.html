<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandShield AI - Login / Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Sticky Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">BrandShield <span>AI</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container fade-in-up">
            <div class="auth-tabs">
                <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-signup" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>
            
            <div class="auth-forms">
                <!-- Login Form -->
                <form id="form-login" class="auth-form active">
                    <h2>Welcome Back</h2>
                    <p class="error-msg" id="login-error"></p>
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Login</button>
                </form>

                <!-- Signup Form -->
                <form id="form-signup" class="auth-form hidden">
                    <h2>Create Account</h2>
                    <p class="error-msg" id="signup-error"></p>
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Sign Up</button>
                </form>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
        setupAuthForms();
    </script>
</body>
</html>

server.port=8080

# Python Flask AI service (POST JSON { "url": "..." } → { "result", "score", "reasons" })
brandshield.ai-service-url=http://localhost:5000/predict

# Databsase Config (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:brandshielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
